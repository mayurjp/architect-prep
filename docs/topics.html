<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Learning — Topics</title>
<link rel="stylesheet" href="assets/css/style.css" />
<script src="assets/js/theme.js"></script>
</head>
<body>
<header class="site">
  <div class="brand">Learning</div>
  <nav>
    <a href="topics.html">Topics</a>
    <a href="search.html">Search</a>
    <button id="theme-toggle" type="button" aria-label="Toggle theme"></button>
  </nav>
</header>
<main>
  <h1>Topics</h1>
  <div id="topic-grid" class="grid"></div>
</main>
<script>
async function init() {
  const [topics, questionIds] = await Promise.all([
    fetch("data/topics.json").then((r) => r.json()),
    fetch("data/question-ids.json").then((r) => r.json())
  ]);
  const mastered = JSON.parse(localStorage.getItem("architect_mastered") || "[]");
  const masteredSet = new Set(mastered);

  topics.sort((a, b) => a.order - b.order);
  const grid = document.getElementById("topic-grid");
  for (const topic of topics) {
    const topicIds = questionIds[topic.id] || [];
    const masteredCount = topicIds.filter(id => masteredSet.has(id)).length;

    const total = topic.counts.total || 0;
    const answered = topic.counts.answered || 0;
    const pct = total ? Math.round((answered / total) * 100) : 0;
    const levelBadges = Object.entries(topic.counts.byLevel || {})
      .map(([lvl, n]) => `<span class="badge ${lvl}">${lvl} · ${n}</span>`)
      .join(" ");
    const card = document.createElement("a");
    card.href = `topic.html?t=${topic.id}`;
    card.className = "card";
    card.style.display = "block";
    card.innerHTML = `
      <div class="topic-title" style="color:${topic.color}">${topic.title}</div>
      <p class="topic-desc">${topic.description}</p>
      <div class="progress-bar"><span style="width:${pct}%;background:${topic.color}"></span></div>
      <p class="muted" style="margin:0.5rem 0 0.6rem">${answered} answered (${masteredCount} mastered) / ${total} total</p>
      <div>${levelBadges || '<span class="muted">No content yet</span>'}</div>`;
    grid.appendChild(card);
  }
}
init();
</script>
</body>
</html>
