<style>

<header class="site">
  <div class="brand">
    <a href="index.html" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:0.75rem;">

<main>
  <p class="q-breadcrumb"><a id="back-link" href="topics.html">← Back to topic</a></p>
  <div id="content"><p class="empty-state">Loading…</p></div>
  <div id="nav-row"></div>
</main>
<script>
const LEVEL_ORDER = ["beginner", "intermediate", "advanced", "scenario"];

async function init() {
  const params = new URLSearchParams(location.search);
  const topicId = params.get("t");
  const questionId = params.get("q");
  const contentEl = document.getElementById("content");

  if (!topicId || !questionId) {
    contentEl.innerHTML = '<p class="empty-state">No question specified.</p>';
    return;
  }

  const [questions, topics] = await Promise.all([
    fetch(`data/questions/${topicId}.json`).then((r) => (r.ok ? r.json() : [])),
    fetch(`data/topics.json`).then((r) => r.json()),
  ]);

  const topic = topics.find((t) => t.id === topicId);
  const q = questions.find((x) => x.id === questionId);

  if (!topic || !q) {
    contentEl.innerHTML = '<p class="empty-state">Question not found.</p>';
    return;
  }

  document.getElementById("back-link").href = `topic.html?t=${topicId}#${topicId}`;
  document.getElementById("back-link").textContent = `← Back to ${topic.title}`;
  document.title = `${q.question} — Architect Prep`;

  const isMastered = () => JSON.parse(localStorage.getItem("architect_mastered") || "[]").includes(q.id);
  const followUpsHtml = (q.followUps || [])
    .map(
      (f) => `<div class="followup">
        <p class="question-text">${escapeHtml(f.question)}</p>
        <div class="answer-body">${f.answerHtml}</div>
      </div>`
    )
    .join("");

  function renderMasteredBtn() {
    const btn = document.getElementById("mastered-btn");
    if (!btn) return;
    const m = isMastered();
    btn.textContent = m ? "Mastered ✓" : "Mark Mastered";
    btn.className = `mastered-btn ${m ? "is-mastered" : ""}`;
  }

  contentEl.innerHTML = `
    <div class="card question-block">
      <span class="badge ${q.level}">${q.level}</span>
      <span class="muted" style="margin-left:0.5rem">${escapeHtml(topic.title)}</span>
      <button id="mastered-btn" class="mastered-btn"></button>
      <p class="question-text">${escapeHtml(q.question)}</p>
      ${q.status === "planned"
        ? '<p class="muted">Coming soon.</p>'
        : `<div class="answer-body">${q.answerHtml}</div>${followUpsHtml}`}
    </div>
  `;
  renderMasteredBtn();
  document.getElementById("mastered-btn").onclick = () => {
    const m = JSON.parse(localStorage.getItem("architect_mastered") || "[]");
    const idx = m.indexOf(q.id);
    if (idx > -1) m.splice(idx, 1);
    else m.push(q.id);
    localStorage.setItem("architect_mastered", JSON.stringify(m));
    renderMasteredBtn();
  };

  contentEl.querySelectorAll("pre code").forEach((el) => hljs.highlightElement(el));

  // Prev/next across the whole topic, ordered the same way topic.html lists them.
  const ordered = questions
    .filter((x) => x.status !== "planned")
    .slice()
    .sort((a, b) => {
      const lv = LEVEL_ORDER.indexOf(a.level) - LEVEL_ORDER.indexOf(b.level);
      return lv !== 0 ? lv : a.seq - b.seq;
    });
  const idx = ordered.findIndex((x) => x.id === q.id);
  const prev = idx > 0 ? ordered[idx - 1] : null;
  const next = idx >= 0 && idx < ordered.length - 1 ? ordered[idx + 1] : null;

  const navRow = document.getElementById("nav-row");
  navRow.innerHTML = `
    <div class="q-nav">
      ${prev
        ? `<a href="question.html?t=${topicId}&q=${prev.id}"><span class="dir">← Previous</span>${escapeHtml(prev.question)}</a>`
        : `<a class="disabled">-</a>`}
      ${next
        ? `<a class="next-wrap" href="question.html?t=${topicId}&q=${next.id}"><span class="dir">Next →</span>${escapeHtml(next.question)}</a>`
        : `<a class="disabled next-wrap">-</a>`}
    </div>
  `;
}

function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

init();
</script>
