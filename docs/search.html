<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Learning — Search</title>
<link rel="icon" type="image/jpeg" href="assets/icon.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css" />
<script src="assets/js/theme.js"></script>
</head>
<body>
<header class="site">
  <div class="brand">
    <a href="index.html" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:0.75rem;">
      <img src="assets/icon.jpg" alt="Logo" style="width:2.2rem;height:2.2rem;border-radius:6px;object-fit:cover;">
      Learning
    </a>
  </div>
  <nav>
    <a href="topics.html">Topics</a>
    <a href="search.html">Search</a>
    <button id="theme-toggle" type="button" aria-label="Toggle theme"></button>
  </nav>
</header>
<main>
  <h1>Search</h1>
  <input type="search" id="q" placeholder="Search questions, e.g. &quot;idempotent&quot; or &quot;DbContext&quot;" autofocus />
  <div id="results" style="margin-top:1.25rem"></div>
</main>
<script src="assets/js/search.js"></script>
<script>
let questions = [];
let topicsById = {};
let visibleCount = 20;
const PAGE_SIZE = 20;
let debounceTimer = null;

async function init() {
  const [q, topics] = await Promise.all([
    fetch(`data/search-index.json`).then((r) => r.json()),
    fetch(`data/topics.json`).then((r) => r.json()),
  ]);
  questions = q;
  topicsById = Object.fromEntries(topics.map((t) => [t.id, t]));

  const input = document.getElementById("q");
  input.addEventListener("input", () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      visibleCount = PAGE_SIZE;
      render(input.value);
    }, 180);
  });
  render("");
}

function render(query) {
  const results = document.getElementById("results");
  if (!query.trim()) {
    results.innerHTML = '<p class="empty-state">Start typing to search the question bank.</p>';
    return;
  }
  const allMatches = filterQuestions(questions, query);
  if (allMatches.length === 0) {
    results.innerHTML = '<p class="empty-state">No matches.</p>';
    return;
  }
  const matches = allMatches.slice(0, visibleCount);
  const cardsHtml = matches
    .map((q, i) => {
      const topic = topicsById[q.topic];
      const delayClass = `delay-${(i % 10) + 1}`;
      return `<a class="card ${delayClass}" style="display:block" href="topic.html?t=${q.topic}&q=${q.id}">
        <span class="badge ${q.level}">${q.level}</span>
        <span class="muted" style="margin-left:0.5rem">${topic ? topic.title : q.topic}</span>
        <p class="question-text">${escapeHtml(q.question)}</p>
        <p class="muted">${escapeHtml(q.snippet || "")}</p>
      </a>`;
    })
    .join("");
  const remaining = allMatches.length - matches.length;
  const moreBtn = remaining > 0
    ? `<button id="show-more" class="expand-all-btn" style="margin-top:1rem">Show ${Math.min(remaining, PAGE_SIZE)} more</button>`
    : "";
  results.innerHTML = cardsHtml + moreBtn;
  if (remaining > 0) {
    document.getElementById("show-more").onclick = () => {
      visibleCount += PAGE_SIZE;
      render(query);
    };
  }
}

function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

init();
</script>
</body>
</html>
