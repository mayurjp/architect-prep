<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Google AdSense: publisher ca-pub-6257755527646234. Auto ads place units
     automatically once the site is approved in the AdSense dashboard. -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6257755527646234" crossorigin="anonymous"></script>
<meta name="author" content="Mayur Patel" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Architect Prep — Topic</title>
<link rel="icon" type="image/jpeg" href="assets/icon.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/dockerfile.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/http.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/protobuf.min.js"></script>
<script>
  // highlight.js's default bundle has no grammar at all for these -- alias them to the
  // closest supported grammar so they still render with some syntax coloring instead of
  // sitting flat/unstyled next to properly-highlighted blocks.
  hljs.registerAliases(["cshtml", "razor"], { languageName: "xml" });
  hljs.registerAliases(["bicep"], { languageName: "json" });
  hljs.registerAliases(["hcl"], { languageName: "ini" });
</script>
<script src="assets/js/theme.js"></script>
</head>
<body>
<div id="focus-modal">
  <button id="focus-close">Close</button>
  <div id="focus-content" class="focus-content"></div>
</div>
<header class="site">
  <div class="brand">
    <a href="index.html" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:0.75rem;">
      <img src="assets/icon.jpg" alt="Logo" style="width:2.2rem;height:2.2rem;border-radius:6px;object-fit:cover;">
      Architect Prep
    </a>
  </div>
  <nav>
    <a href="topics.html">Topics</a>
    <a href="search.html">Search</a>
    <a href="review.html">Review</a>
    <button id="theme-toggle" type="button" aria-label="Toggle theme"></button>
  </nav>
</header>
<main>
  <h1 id="topic-title">Topic</h1>
  <p id="topic-desc" class="muted"></p>
  <div id="level-tabs" class="tabs"></div>
  <div id="question-list"></div>
</main>
<script>
const LEVEL_ORDER = ["beginner", "intermediate", "advanced", "scenario"];

async function init() {
  const params = new URLSearchParams(location.search);
  const topicId = params.get("t") || location.hash.substring(1);
  const deepLinkId = params.get("q");
  const [questions, topics] = await Promise.all([
    fetch(`data/questions/${topicId}.json`).then((r) => (r.ok ? r.json() : [])),
    fetch(`data/topics.json`).then((r) => r.json()),
  ]);

  const topic = topics.find((t) => t.id === topicId);
  if (!topic) {
    document.getElementById("topic-title").textContent = "Topic not found";
    return;
  }
  document.getElementById("topic-title").textContent = topic.title;
  document.getElementById("topic-title").style.color = topic.color;
  document.getElementById("topic-desc").textContent = topic.description;

  const byLevel = {};
  for (const q of questions) {
    (byLevel[q.level] = byLevel[q.level] || []).push(q);
  }
  for (const lvl of Object.keys(byLevel)) byLevel[lvl].sort((a, b) => a.seq - b.seq);

  const availableLevels = LEVEL_ORDER.filter((l) => byLevel[l] && byLevel[l].length);
  const tabsEl = document.getElementById("level-tabs");
  const listEl = document.getElementById("question-list");

  if (availableLevels.length === 0) {
    listEl.innerHTML = '<p class="empty-state">No content yet for this topic.</p>';
    return;
  }

  const deepLinkQuestion = deepLinkId ? questions.find((q) => q.id === deepLinkId) : null;
  let activeLevel = deepLinkQuestion ? deepLinkQuestion.level : availableLevels[0];
  const openIds = new Set(deepLinkQuestion ? [deepLinkQuestion.id] : []);

  window.toggleMastered = (id) => {
    const m = JSON.parse(localStorage.getItem("architect_mastered") || "[]");
    const idx = m.indexOf(id);
    if (idx > -1) m.splice(idx, 1);
    else m.push(id);
    localStorage.setItem("architect_mastered", JSON.stringify(m));
    render();
  };

  window.openFocus = (id) => {
    const q = questions.find(x => x.id === id);
    if(!q) return;
    const followUpsHtml = (q.followUps || []).map(f => `<div class="followup"><p class="question-text">${escapeHtml(f.question)}</p><div class="answer-body">${f.answerHtml}</div></div>`).join("");
    document.getElementById("focus-content").innerHTML = `
      <span class="badge ${q.level}">${q.level}</span>
      <p class="question-text">${escapeHtml(q.question)}</p>
      <div class="answer-body">${q.answerHtml}</div>
      ${followUpsHtml}
    `;
    document.getElementById("focus-modal").classList.add("active");
    document.body.style.overflow = "hidden";
    hljs.highlightAll();
  };

  document.getElementById("focus-close").onclick = () => {
    document.getElementById("focus-modal").classList.remove("active");
    document.body.style.overflow = "";
  };

  window.toggleExpand = (id) => {
    if (openIds.has(id)) openIds.delete(id);
    else openIds.add(id);
    render();
    if (openIds.has(id)) {
      const el = document.getElementById(`q-${id}`);
      const body = el && el.querySelector(".answer-body");
      if (body) body.querySelectorAll("pre code").forEach((el) => hljs.highlightElement(el));
    }
  };

  window.expandAll = () => {
    byLevel[activeLevel].forEach((q) => { if (q.status !== "planned") openIds.add(q.id); });
    render();
    listEl.querySelectorAll(".answer-body pre code").forEach((el) => hljs.highlightElement(el));
  };

  function render() {
    tabsEl.innerHTML = "";
    for (const lvl of availableLevels) {
      const btn = document.createElement("button");
      btn.textContent = `${lvl[0].toUpperCase()}${lvl.slice(1)} (${byLevel[lvl].length})`;
      btn.className = lvl === activeLevel ? "active" : "";
      btn.onclick = () => { activeLevel = lvl; render(); };
      tabsEl.appendChild(btn);
    }

    const expandAllBtn = document.createElement("button");
    expandAllBtn.textContent = "Expand all";
    expandAllBtn.className = "expand-all-btn";
    expandAllBtn.onclick = () => window.expandAll();
    tabsEl.appendChild(expandAllBtn);

    listEl.innerHTML = "";
    byLevel[activeLevel].forEach((q, i) => {
      const block = document.createElement("div");
      const delayClass = `delay-${(i % 10) + 1}`;
      const isMastered = JSON.parse(localStorage.getItem("architect_mastered") || "[]").includes(q.id);
      const isOpen = openIds.has(q.id);
      block.id = `q-${q.id}`;
      block.className = `card question-block ${isMastered ? "is-mastered" : ""} ${delayClass}`;
      const followUpsHtml = isOpen
        ? (q.followUps || [])
            .map(
              (f) => `<div class="followup">
                <p class="question-text">${escapeHtml(f.question)}</p>
                <div class="answer-body">${f.answerHtml}</div>
              </div>`
            )
            .join("")
        : "";
      if (q.status === "planned") {
        block.innerHTML = `
          <span class="badge planned">Planned</span>
          <p class="question-text">${escapeHtml(q.question)}</p>
          <p class="muted">Coming soon.</p>`;
      } else {
        block.innerHTML = `
          <span class="badge ${q.level}">${q.level}</span>
          <button class="mastered-btn ${isMastered ? "is-mastered" : ""}" onclick="toggleMastered('${q.id}')">
            ${isMastered ? "Mastered ✓" : "Mark Mastered"}
          </button>
          <button class="focus-btn" onclick="openFocus('${q.id}')">Focus Mode ⛶</button>
          <button class="q-toggle" onclick="toggleExpand('${q.id}')" style="display:block;width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:0">
            <p class="question-text">${isOpen ? "▾" : "▸"} ${escapeHtml(q.question)}</p>
          </button>
          ${isOpen ? `<div class="answer-body">${q.answerHtml}</div>${followUpsHtml}` : ""}`;
      }
      listEl.appendChild(block);
    });
  }

  render();
  if (deepLinkQuestion) {
    const body = document.getElementById(`q-${deepLinkQuestion.id}`)?.querySelector(".answer-body");
    if (body) body.querySelectorAll("pre code").forEach((el) => hljs.highlightElement(el));
    document.getElementById(`q-${deepLinkQuestion.id}`)?.scrollIntoView({ block: "center" });
  }
}

function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

init();
</script>
<script src="assets/js/footer.js"></script>
</body>
</html>
