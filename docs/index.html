<header class="site">
  <div class="brand">
    <a href="index.html" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:0.75rem;">
      <img src="assets/icon.jpg" alt="Logo" style="width:2.2rem;height:2.2rem;border-radius:6px;object-fit:cover;">
      Architect Prep
    </a>
  </div>
  <nav>
    <a href="topics.html">Topics</a>
    <a href="search.html">Search</a>
    <a href="review.html">Review</a>
    <button id="theme-toggle" type="button" aria-label="Toggle theme"></button>
  </nav>
</header>
<main>
  <h1>Topics</h1>
  <div id="topic-grid" class="grid"></div>
</main>
<script>
async function init() {
  const [topics, questionIds] = await Promise.all([
    fetch(`data/topics.json`).then((r) => r.json()),
    fetch(`data/question-ids.json`).then((r) => r.json())
  ]);
  const mastered = JSON.parse(localStorage.getItem("architect_mastered") || "[]");
  const masteredSet = new Set(mastered);

  topics.sort((a, b) => a.order - b.order);
  const grid = document.getElementById("topic-grid");

  topics.forEach((topic, i) => {
    const topicIds = questionIds[topic.id] || [];
    const masteredCount = topicIds.filter(id => masteredSet.has(id)).length;

    const total = topicIds.length;
    const pct = total ? Math.round((masteredCount / total) * 100) : 0;
    
    const levelBadges = Object.entries(topic.counts.byLevel || {})
      .map(([lvl, n]) => `<span class="badge ${lvl}">${lvl} · ${n}</span>`)
      .join(" ");
      
    const delayClass = `delay-${(i % 10) + 1}`;
    
    const card = document.createElement("a");
    card.href = `topic.html?t=${topic.id}#${topic.id}`;
    card.className = `card ${delayClass}`;
    card.style.display = "block";
    card.innerHTML = `
      <div class="topic-title" style="color:${topic.color}">${topic.title}</div>
      <div style="margin-top:0.75rem">${levelBadges}</div>
      <div style="margin-top:1.25rem;">
        <div style="display:flex; justify-content:space-between; margin-bottom:0.4rem; font-size:0.85rem;" class="muted">
          <span>Mastery</span>
          <span>${pct}%</span>
        </div>
        <div class="progress-bar">
          <span style="width: ${pct}%"></span>
        </div>
      </div>`;
    grid.appendChild(card);
  });
}
init();
</script>
