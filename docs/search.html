<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Architect Prep — Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css" />
<script src="assets/js/theme.js"></script>
</head>
<body>
<header class="site">
  <div class="brand"><a href="index.html" style="color:inherit;text-decoration:none">Architect Prep</a></div>
  <nav>
    <a href="search.html">Search</a>
    <button id="theme-toggle" type="button" aria-label="Toggle theme"></button>
  </nav>
</header>
<main>
  <h1>Search</h1>
  <input type="search" id="q" placeholder="Search questions, e.g. &quot;idempotent&quot; or &quot;DbContext&quot;" autofocus />
  <div id="results" style="margin-top:1.25rem"></div>
</main>
<script src="assets/js/search.js"></script>
<script>
let questions = [];
let topicsById = {};

async function init() {
  const cb = Date.now();
  const [q, topics] = await Promise.all([
    fetch(`data/questions.json?v=${cb}`).then((r) => r.json()),
    fetch(`data/topics.json?v=${cb}`).then((r) => r.json()),
  ]);
  questions = q;
  topicsById = Object.fromEntries(topics.map((t) => [t.id, t]));

  const input = document.getElementById("q");
  input.addEventListener("input", () => render(input.value));
  render("");
}

function render(query) {
  const results = document.getElementById("results");
  if (!query.trim()) {
    results.innerHTML = '<p class="empty-state">Start typing to search the question bank.</p>';
    return;
  }
  const matches = filterQuestions(questions, query).slice(0, 50);
  if (matches.length === 0) {
    results.innerHTML = '<p class="empty-state">No matches.</p>';
    return;
  }
  results.innerHTML = matches
    .map((q, i) => {
      const topic = topicsById[q.topic];
      const delayClass = `delay-${(i % 10) + 1}`;
      return `<a class="card ${delayClass}" style="display:block" href="topic.html?t=${q.topic}#${q.topic}">
        <span class="badge ${q.status === "planned" ? "planned" : q.level}">${q.status === "planned" ? "planned" : q.level}</span>
        <span class="muted" style="margin-left:0.5rem">${topic ? topic.title : q.topic}</span>
        <p class="question-text">${escapeHtml(q.question)}</p>
      </a>`;
    })
    .join("");
}

function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

init();
</script>
</body>
</html>
