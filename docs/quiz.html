<style>
  .quiz-section { margin-bottom: 1.75rem; }
  .quiz-section h2 {
    font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-dim); margin: 0 0 0.75rem;
  }
  .chip-row { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .chip {
    background: var(--surface-2); border: 1px solid transparent; color: var(--text-dim);
    padding: 0.5rem 0.95rem; border-radius: 999px; cursor: pointer;
    font-family: 'Outfit', sans-serif; font-size: 0.85rem; font-weight: 600;
    transition: all 0.15s ease;
  }
  .chip:hover { color: var(--text); }
  .chip.active {
    background: var(--accent-gradient); color: #fff;
    box-shadow: 0 4px 15px rgba(139, 92, 246, 0.35);
  }
  .chip.level.active.beginner { background: #10b981; box-shadow: none; }
  .chip.level.active.intermediate { background: #0ea5e9; box-shadow: none; }
  .chip.level.active.advanced { background: #ec4899; box-shadow: none; }
  .chip.level.active.scenario { background: #f59e0b; box-shadow: none; }
  .chip .chip-count { opacity: 0.7; font-weight: 500; margin-left: 0.3rem; }

  .link-btn {
    background: none; border: none; color: var(--accent); cursor: pointer;
    font-family: 'Outfit', sans-serif; font-size: 0.8rem; font-weight: 600; padding: 0.25rem 0;
  }
  .count-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
  .count-row input[type="number"] {
    width: 6rem; padding: 0.5rem 0.75rem; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    font-family: 'Outfit', sans-serif; font-size: 0.9rem; font-weight: 600;
  }
  .avail { color: var(--text-dim); font-size: 0.85rem; margin-left: 0.25rem; }

  .check-row { display: flex; align-items: center; gap: 0.5rem; color: var(--text-dim); font-size: 0.9rem; }
  .check-row input { width: 1rem; height: 1rem; accent-color: var(--accent); }

  .primary-btn {
    font-family: 'Outfit', sans-serif; font-weight: 700; border: none; border-radius: 999px;
    padding: 0.9rem 2rem; cursor: pointer; font-size: 1rem; color: #fff;
    background: var(--accent-gradient); box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
    transition: transform 0.2s ease;
  }
  .primary-btn:hover:not(:disabled) { transform: translateY(-2px); }
  .primary-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .ghost-btn {
    font-family: 'Outfit', sans-serif; font-weight: 700; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text); border-radius: 999px;
    padding: 0.9rem 1.6rem; cursor: pointer; font-size: 0.95rem;
  }
  .ghost-btn:hover { border-color: var(--accent); }

  .banner {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 1rem 1.25rem; margin-bottom: 1.75rem; display: flex; flex-wrap: wrap;
    align-items: center; gap: 0.75rem 1rem;
  }
  .banner .banner-text { flex: 1; min-width: 12rem; font-size: 0.9rem; }

  .qcard { margin-bottom: 1.1rem; }
  .qcard .qhead { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin-bottom: 0.6rem; }
  .qcard .qnum { font-weight: 700; color: var(--text-dim); }
  .qcard .stem { font-size: 1.1rem; font-weight: 600; margin: 0.4rem 0 0.9rem; }
  .opt {
    display: flex; align-items: flex-start; gap: 0.6rem; padding: 0.6rem 0.8rem;
    border: 1px solid var(--border); border-radius: 10px; margin-bottom: 0.5rem;
    cursor: pointer; transition: background 0.12s ease, border-color 0.12s ease;
  }
  .opt:hover { border-color: var(--accent); }
  .opt input { margin-top: 0.15rem; accent-color: var(--accent); }
  .opt .opt-letter { font-weight: 700; color: var(--text-dim); }
  .opt.correct { border-color: #10b981; background: rgba(16, 185, 129, 0.12); }
  .opt.wrong { border-color: #ef4444; background: rgba(239, 68, 68, 0.12); }
  .opt.disabled { cursor: default; }
  .opt.disabled:hover { border-color: var(--border); }
  .opt.correct.disabled:hover { border-color: #10b981; }
  .opt.wrong.disabled:hover { border-color: #ef4444; }

  .explain {
    margin-top: 0.6rem; padding: 0.7rem 0.9rem; border-left: 3px solid var(--accent);
    background: var(--surface-2); border-radius: 6px; font-size: 0.9rem; color: var(--text-dim);
  }
  .fallback-tag {
    font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-dim); border: 1px dashed var(--border); border-radius: 999px;
    padding: 0.1rem 0.5rem;
  }

  .sticky-bar {
    position: sticky; bottom: 0; margin-top: 1.5rem; padding: 1rem 1.25rem;
    background: var(--surface); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
    display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1rem;
  }
  .sticky-bar .progress-text { flex: 1; min-width: 8rem; color: var(--text-dim); font-size: 0.9rem; }

  .score-hero { text-align: center; padding: 2rem 1rem 1rem; }
  .score-hero .big { font-size: 3rem; font-weight: 800; }
  .score-hero .pct { color: var(--text-dim); font-size: 1.1rem; }

  table.breakdown { width: 100%; border-collapse: collapse; margin: 1rem 0 2rem; font-size: 0.9rem; }
  table.breakdown th, table.breakdown td { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--border); }
  table.breakdown th { color: var(--text-dim); font-weight: 600; cursor: pointer; }
  table.breakdown td .mini-bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
  table.breakdown td .mini-bar > span { display: block; height: 100%; background: var(--accent-gradient); }

  .answer-line { font-size: 0.9rem; margin: 0.3rem 0; }
  .answer-line.you-wrong { color: #ef4444; }
  .answer-line.you-right { color: #10b981; }
  .answer-line .lead { color: var(--text-dim); }

  .results-actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin: 1.5rem 0 2.5rem; }

  .print-only { display: none; }

  @media print {
    header.site, .site-footer, #theme-toggle, .sticky-bar, .results-actions,
    .banner, .setup-controls, .link-btn, .primary-btn, .ghost-btn, .breakdown th { display: none !important; }
    .print-only { display: block; margin-bottom: 1.5rem; }
    body { background: #fff; color: #000; }
    main { max-width: none; }
    .qcard, .card { break-inside: avoid; box-shadow: none !important; border: 1px solid #000 !important;
      background: #fff !important; backdrop-filter: none !important; }
    .opt { border-color: #000 !important; background: #fff !important; }
    .opt.correct { background: #fff !important; }
    .opt.correct::after { content: " ✓"; font-weight: 700; }
    .explain { background: #fff; border-left-color: #000; color: #000; }
    .score-hero .big { color: #000; }
  }
</style>
</head>
<body>
<header class="site">
  <div class="brand">
    <a href="index.html" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:0.75rem;">
      <img src="assets/icon.jpg" alt="Logo" style="width:2.2rem;height:2.2rem;border-radius:6px;object-fit:cover;">
      Architect Prep
    </a>
  </div>
  <nav>
    <a href="topics.html">Topics</a>
    <a href="search.html">Search</a>
    <a href="review.html">Review</a>
    <a href="quiz.html">Quiz</a>
    <button id="theme-toggle" type="button" aria-label="Toggle theme"></button>
  </nav>
</header>
<main>
  <h1>Quiz</h1>
  <p class="muted" style="margin-top:-1.5rem;margin-bottom:2rem">Pick a topic and answer its AI-generated multiple-choice paper, then get a scored breakdown.</p>
  <div id="app"></div>
</main>
<script>
const LAST_KEY = "architect_quiz_last";

let topics = [];
let topicsById = {};
let mcqIndex = {};
let cache = {}; // topicId -> mcq array

let selectedTopic = null;

let paper = [];      // active paper (in progress / results)
let lastResult = null;

function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

async function fetchTopicMcq(topicId) {
  if (cache[topicId]) return cache[topicId];
  const list = await fetch(`data/mcq/${topicId}.json`).then((r) => (r.ok ? r.json() : []));
  cache[topicId] = list;
  return list;
}

async function init() {
  const [t, ix] = await Promise.all([
    fetch("data/topics.json").then((r) => r.json()),
    fetch("data/mcq/index.json").then((r) => r.json()),
  ]);
  topics = t.slice().sort((a, b) => a.order - b.order);
  topicsById = Object.fromEntries(topics.map((tp) => [tp.id, tp]));
  mcqIndex = ix;

  try {
    lastResult = JSON.parse(localStorage.getItem(LAST_KEY) || "null");
  } catch (e) {
    lastResult = null;
  }

  renderSetup();
}

/* ---------- Setup ---------- */

function renderSetup() {
  const app = document.getElementById("app");
  const genTopics = topics.filter((tp) => (mcqIndex[tp.id] || {}).generated > 0);

  const bannerHtml = lastResult
    ? `<div class="banner">
        <span class="banner-text">Last attempt: <strong>${lastResult.score}/${lastResult.n}</strong>
          (${Math.round((lastResult.score / lastResult.n) * 100)}%) &middot; ${new Date(lastResult.at).toLocaleDateString()}</span>
        <button class="ghost-btn" onclick="viewLastResult()">View result</button>
        ${lastResult.wrongIds && lastResult.wrongIds.length
          ? `<button class="ghost-btn" onclick="startRetry()">Retry ${lastResult.wrongIds.length} wrong</button>`
          : ""}
      </div>`
    : "";

  if (genTopics.length === 0) {
    app.innerHTML = `${bannerHtml}
      <p class="empty-state">No AI-generated MCQs are available yet. Run <code>npm run gen:mcq</code>, then <code>npm run build</code>.</p>`;
    return;
  }

  const topicChips = genTopics
    .map((tp) => {
      const c = (mcqIndex[tp.id] || {}).generated || 0;
      const on = selectedTopic === tp.id;
      return `<button class="chip topic${on ? " active" : ""}" data-topic="${tp.id}">
        ${escapeHtml(tp.title)}<span class="chip-count">${c}</span>
      </button>`;
    })
    .join("");

  app.innerHTML = `
    ${bannerHtml}
    <div class="setup-controls">
      <div class="quiz-section">
        <h2>Choose a topic</h2>
        <div class="chip-row" id="topic-chips">${topicChips}</div>
      </div>

      <button class="primary-btn" id="start-btn" ${selectedTopic ? "" : "disabled"}>Start quiz</button>
    </div>
  `;

  app.querySelectorAll("#topic-chips .chip").forEach((el) => {
    el.onclick = () => {
      selectedTopic = el.dataset.topic;
      renderSetup();
    };
  });
  document.getElementById("start-btn").onclick = () => startPaper();
}

/* ---------- Paper build ---------- */

function interleaveByTopic(items) {
  const groups = new Map();
  for (const it of items) {
    if (!groups.has(it.topic)) groups.set(it.topic, []);
    groups.get(it.topic).push(it);
  }
  const lists = [...groups.values()];
  const out = [];
  let added = true;
  while (added) {
    added = false;
    for (const list of lists) {
      if (list.length) {
        out.push(list.shift());
        added = true;
      }
    }
  }
  return out;
}

function makePaperItems(mcqs) {
  return mcqs.map((m, i) => {
    const order = shuffle([0, 1, 2, 3]);
    return {
      n: i + 1,
      id: m.id,
      topic: m.topic,
      level: m.level,
      sourceQuestion: m.sourceQuestion,
      stem: m.stem,
      options: order.map((k) => m.options[k]),
      correctIndex: order.indexOf(m.correctIndex),
      explanation: m.explanation,
      origin: m.origin,
      chosen: null,
    };
  });
}

async function startPaper() {
  const app = document.getElementById("app");
  app.innerHTML = `<p class="empty-state">Building paper…</p>`;

  const list = await fetchTopicMcq(selectedTopic);
  const pool = shuffle(list.filter((m) => m.origin === "generated"));
  paper = makePaperItems(pool);

  if (paper.length === 0) {
    app.innerHTML = `<p class="empty-state">No AI-generated questions are available for this topic.</p>
      <button class="ghost-btn" onclick="renderSetup()">Back to setup</button>`;
    return;
  }
  renderInProgress();
}

async function startRetry() {
  if (!lastResult || !lastResult.wrongIds || !lastResult.wrongIds.length) return;
  const app = document.getElementById("app");
  app.innerHTML = `<p class="empty-state">Building paper…</p>`;

  const ids = [...new Set(lastResult.wrongIds)];
  const topicIds = [...new Set(ids.map((x) => x.split("__")[0]))];
  const arrays = await Promise.all(topicIds.map(fetchTopicMcq));
  const want = new Set(ids);
  const pool = interleaveByTopic(shuffle(arrays.flat().filter((m) => want.has(m.id))));
  paper = makePaperItems(pool);

  if (paper.length === 0) {
    app.innerHTML = `<p class="empty-state">Those questions are no longer available.</p>
      <button class="ghost-btn" onclick="renderSetup()">Back to setup</button>`;
    return;
  }
  renderInProgress();
}

/* ---------- In progress ---------- */

function optionLetter(i) {
  return String.fromCharCode(65 + i);
}

function renderInProgress() {
  const app = document.getElementById("app");
  const cards = paper
    .map((it) => {
      const opts = it.options
        .map(
          (o, i) => `<label class="opt">
            <input type="radio" name="q${it.n}" value="${i}" ${it.chosen === i ? "checked" : ""} />
            <span class="opt-letter">${optionLetter(i)}.</span>
            <span>${escapeHtml(o)}</span>
          </label>`
        )
        .join("");
      return `<div class="card qcard">
        <div class="qhead">
          <span class="qnum">${it.n}.</span>
          <span class="badge ${it.level}">${it.level}</span>
          <span class="muted">${escapeHtml((topicsById[it.topic] || {}).title || it.topic)}</span>
          ${it.origin === "fallback" ? `<span class="fallback-tag">match-the-answer</span>` : ""}
        </div>
        <p class="stem">${escapeHtml(it.stem)}</p>
        ${opts}
      </div>`;
    })
    .join("");

  app.innerHTML = `
    <div class="print-only"><h2 id="paper-title"></h2></div>
    ${cards}
    <div class="sticky-bar">
      <span class="progress-text" id="answered-count"></span>
      <button class="ghost-btn" onclick="window.print()">Print blank paper</button>
      <button class="ghost-btn" onclick="abandonPaper()">Cancel</button>
      <button class="primary-btn" id="submit-btn">Submit</button>
    </div>
  `;

  document.getElementById("paper-title").textContent =
    `Architect Prep — Question Paper (${paper.length} questions, ${new Date().toLocaleDateString()})`;

  app.querySelectorAll(".opt input").forEach((input) => {
    input.onchange = () => {
      const idx = parseInt(input.name.slice(1), 10) - 1;
      paper[idx].chosen = parseInt(input.value, 10);
      updateAnsweredCount();
    };
  });
  document.getElementById("submit-btn").onclick = submitPaper;
  updateAnsweredCount();
}

function updateAnsweredCount() {
  const done = paper.filter((it) => it.chosen !== null).length;
  document.getElementById("answered-count").textContent = `Answered ${done} / ${paper.length}`;
}

function abandonPaper() {
  paper = [];
  renderSetup();
}

function submitPaper() {
  const unanswered = paper.filter((it) => it.chosen === null).length;
  if (unanswered > 0 && !confirm(`Submit with ${unanswered} question${unanswered === 1 ? "" : "s"} unanswered?`)) {
    return;
  }
  const result = gradePaper();
  persistResult(result);
  renderResults(result);
}

/* ---------- Grading + results ---------- */

function gradePaper() {
  let score = 0;
  const perTopic = {};
  const wrongIds = [];
  for (const it of paper) {
    const t = perTopic[it.topic] || (perTopic[it.topic] = { correct: 0, attempted: 0, total: 0 });
    t.total += 1;
    if (it.chosen !== null) {
      t.attempted += 1;
      if (it.chosen === it.correctIndex) {
        score += 1;
        t.correct += 1;
      } else {
        wrongIds.push(it.id);
      }
    } else {
      wrongIds.push(it.id);
    }
  }
  return { score, n: paper.length, perTopic, wrongIds, at: Date.now() };
}

function persistResult(result) {
  lastResult = {
    at: result.at,
    score: result.score,
    n: result.n,
    perTopic: result.perTopic,
    wrongIds: result.wrongIds,
    paper: paper,
  };
  try {
    localStorage.setItem(LAST_KEY, JSON.stringify(lastResult));
  } catch (e) {
    /* storage full / disabled — results still render this session */
  }
}

function viewLastResult() {
  if (!lastResult || !lastResult.paper) return;
  paper = lastResult.paper;
  renderResults({
    score: lastResult.score,
    n: lastResult.n,
    perTopic: lastResult.perTopic,
    wrongIds: lastResult.wrongIds,
    at: lastResult.at,
  });
}

let breakdownSort = "weakest";

function renderResults(result) {
  const app = document.getElementById("app");
  const pct = Math.round((result.score / result.n) * 100);

  const rows = Object.entries(result.perTopic).map(([id, s]) => {
    const p = s.total ? Math.round((s.correct / s.total) * 100) : 0;
    return { id, title: (topicsById[id] || {}).title || id, correct: s.correct, total: s.total, pct: p };
  });
  rows.sort((a, b) =>
    breakdownSort === "weakest" ? a.pct - b.pct || a.title.localeCompare(b.title) : a.title.localeCompare(b.title)
  );
  const breakdownRows = rows
    .map(
      (r) => `<tr>
        <td>${escapeHtml(r.title)}</td>
        <td>${r.correct} / ${r.total}</td>
        <td>${r.pct}%</td>
        <td style="width:30%"><span class="mini-bar"><span style="width:${r.pct}%"></span></span></td>
      </tr>`
    )
    .join("");

  const review = paper
    .map((it) => {
      const yourText = it.chosen === null ? "Not answered" : `${optionLetter(it.chosen)}. ${it.options[it.chosen]}`;
      const right = it.chosen === it.correctIndex;
      const opts = it.options
        .map((o, i) => {
          let cls = "opt disabled";
          if (i === it.correctIndex) cls += " correct";
          else if (i === it.chosen) cls += " wrong";
          return `<div class="${cls}"><span class="opt-letter">${optionLetter(i)}.</span> <span>${escapeHtml(o)}</span></div>`;
        })
        .join("");
      return `<div class="card qcard">
        <div class="qhead">
          <span class="qnum">${it.n}.</span>
          <span class="badge ${it.level}">${it.level}</span>
          <span class="muted">${escapeHtml((topicsById[it.topic] || {}).title || it.topic)}</span>
          ${it.origin === "fallback" ? `<span class="fallback-tag">match-the-answer</span>` : ""}
        </div>
        <p class="stem">${escapeHtml(it.stem)}</p>
        ${opts}
        <p class="answer-line ${right ? "you-right" : "you-wrong"}">
          <span class="lead">Your answer:</span> ${escapeHtml(yourText)} ${right ? "✓" : "✗"}
        </p>
        <div class="explain">${escapeHtml(it.explanation)}</div>
        <p style="margin-top:0.5rem"><a href="topic.html?t=${it.topic}&q=${it.id}">See full question &amp; answer →</a></p>
      </div>`;
    })
    .join("");

  const keyList = paper.map((it) => `${it.n}: ${optionLetter(it.correctIndex)}`).join(" &middot; ");

  app.innerHTML = `
    <div class="print-only"><h2>Architect Prep — Question Paper (results, ${new Date(result.at).toLocaleDateString()})</h2></div>
    <div class="score-hero">
      <div class="big">${result.score} / ${result.n}</div>
      <div class="pct">${pct}% correct</div>
    </div>

    <h2 style="font-size:0.8rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim)">By topic</h2>
    <table class="breakdown">
      <thead><tr><th id="sort-toggle">Topic (${breakdownSort === "weakest" ? "weakest first" : "A–Z"})</th><th>Score</th><th>%</th><th></th></tr></thead>
      <tbody>${breakdownRows}</tbody>
    </table>

    <div class="results-actions">
      ${result.wrongIds && result.wrongIds.length ? `<button class="primary-btn" onclick="startRetry()">Retry ${result.wrongIds.length} wrong</button>` : ""}
      <button class="ghost-btn" onclick="renderSetup()">New paper</button>
      <button class="ghost-btn" onclick="window.print()">Print</button>
    </div>

    <h2 style="font-size:0.8rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim)">Review</h2>
    ${review}

    <div class="card" style="margin-top:1.5rem">
      <strong>Answer key</strong>
      <p class="muted" style="margin-top:0.4rem">${keyList}</p>
    </div>
  `;

  // keep retry button in results wired to the just-finished attempt
  lastResult = lastResult || {};
  lastResult.wrongIds = result.wrongIds;

  const sortToggle = document.getElementById("sort-toggle");
  if (sortToggle) {
    sortToggle.onclick = () => {
      breakdownSort = breakdownSort === "weakest" ? "az" : "weakest";
      renderResults(result);
    };
  }
}

init();
</script>
<script src="assets/js/footer.js"></script>
</body>
</html>
