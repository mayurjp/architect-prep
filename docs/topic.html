<main>
  <h1 id="topic-title">Topic</h1>
  <p id="topic-desc" class="muted"></p>
  <div id="level-tabs" class="tabs"></div>
  <div id="question-list"></div>
</main>
<script>
const LEVEL_ORDER = ["beginner", "intermediate", "advanced", "scenario"];

async function init() {
  const params = new URLSearchParams(location.search);
  const topicId = params.get("t") || location.hash.substring(1);
  const deepLinkId = params.get("q");
  if (deepLinkId) {
    location.replace(`question.html?t=${topicId}&q=${deepLinkId}`);
    return;
  }
  const [questions, topics] = await Promise.all([
    fetch(`data/questions/${topicId}.json`).then((r) => (r.ok ? r.json() : [])),
    fetch(`data/topics.json`).then((r) => r.json()),
  ]);

  const topic = topics.find((t) => t.id === topicId);
  if (!topic) {
    document.getElementById("topic-title").textContent = "Topic not found";
    return;
  }
  document.getElementById("topic-title").textContent = topic.title;
  document.getElementById("topic-title").style.color = topic.color;
  document.getElementById("topic-desc").textContent = topic.description;

  const byLevel = {};
  for (const q of questions) {
    (byLevel[q.level] = byLevel[q.level] || []).push(q);
  }
  for (const lvl of Object.keys(byLevel)) byLevel[lvl].sort((a, b) => a.seq - b.seq);

  const availableLevels = LEVEL_ORDER.filter((l) => byLevel[l] && byLevel[l].length);
  const tabsEl = document.getElementById("level-tabs");
  const listEl = document.getElementById("question-list");

  if (availableLevels.length === 0) {
    listEl.innerHTML = '<p class="empty-state">No content yet for this topic.</p>';
    return;
  }

  let activeLevel = availableLevels[0];

  window.toggleMastered = (id) => {
    const m = JSON.parse(localStorage.getItem("architect_mastered") || "[]");
    const idx = m.indexOf(id);
    if (idx > -1) m.splice(idx, 1);
    else m.push(id);
    localStorage.setItem("architect_mastered", JSON.stringify(m));
    render();
  };

  function render() {
    tabsEl.innerHTML = "";
    for (const lvl of availableLevels) {
      const btn = document.createElement("button");
      btn.textContent = `${lvl[0].toUpperCase()}${lvl.slice(1)} (${byLevel[lvl].length})`;
      btn.className = lvl === activeLevel ? "active" : "";
      btn.onclick = () => { activeLevel = lvl; render(); };
      tabsEl.appendChild(btn);
    }

    listEl.innerHTML = "";
    byLevel[activeLevel].forEach((q, i) => {
      const block = document.createElement("div");
      const delayClass = `delay-${(i % 10) + 1}`;
      const isMastered = JSON.parse(localStorage.getItem("architect_mastered") || "[]").includes(q.id);
      block.id = `q-${q.id}`;
      block.className = `card question-block ${isMastered ? "is-mastered" : ""} ${delayClass}`;
      if (q.status === "planned") {
        block.innerHTML = `
          <span class="badge planned">Planned</span>
          <p class="question-text">${escapeHtml(q.question)}</p>
          <p class="muted">Coming soon.</p>`;
      } else {
        block.innerHTML = `
          <span class="badge ${q.level}">${q.level}</span>
          <button class="mastered-btn ${isMastered ? "is-mastered" : ""}" onclick="toggleMastered('${q.id}')">
            ${isMastered ? "Mastered ✓" : "Mark Mastered"}
          </button>
          <a href="question.html?t=${topicId}&q=${q.id}" style="display:block;text-decoration:none;color:inherit">
            <p class="question-text">${escapeHtml(q.question)}</p>
          </a>`;
      }
      listEl.appendChild(block);
    });
  }

  render();
}

function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

init();
</script>
