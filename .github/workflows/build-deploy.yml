name: Build and deploy

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "scripts/**"
      - "docs/**"
      - "package.json"
      - ".github/workflows/build-deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # npm ci installs the @anthropic-ai/sdk devDependency, but the build never
      # imports it — it is used only by the local, manual `npm run gen:mcq`.
      # build.js reads the committed content/mcq/*.json cache and needs no API key.
      - run: npm ci
      - run: node scripts/build.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
