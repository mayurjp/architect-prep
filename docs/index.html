<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Learning</title>
<link rel="icon" type="image/jpeg" href="assets/icon.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css" />
<script src="assets/js/theme.js"></script>
</head>
<body>
<header class="site">
  <div class="brand">
    <a href="index.html" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:0.75rem;">
      <img src="assets/icon.jpg" alt="Logo" style="width:2.2rem;height:2.2rem;border-radius:6px;object-fit:cover;">
      Learning
    </a>
  </div>
  <nav>
    <a href="search.html">Search</a>
    <button id="theme-toggle" type="button" aria-label="Toggle theme"></button>
  </nav>
</header>
<main>
  <h1>Topics</h1>
  <div id="topic-grid" class="grid"></div>
</main>
<script>
async function init() {
  const cb = Date.now();
  const [topics, questions] = await Promise.all([
    fetch(`data/topics.json?v=${cb}`).then((r) => r.json()),
    fetch(`data/questions.json?v=${cb}`).then((r) => r.json())
  ]);
  const mastered = JSON.parse(localStorage.getItem("architect_mastered") || "[]");
  const masteredSet = new Set(mastered);
  
  topics.sort((a, b) => a.order - b.order);
  const grid = document.getElementById("topic-grid");
  
  topics.forEach((topic, i) => {
    const topicQuestions = questions.filter(q => q.topic === topic.id);
    const masteredCount = topicQuestions.filter(q => masteredSet.has(q.id)).length;
    
    const total = topicQuestions.length;
    const pct = total ? Math.round((masteredCount / total) * 100) : 0;
    
    const levelBadges = Object.entries(topic.counts.byLevel || {})
      .map(([lvl, n]) => `<span class="badge ${lvl}">${lvl} · ${n}</span>`)
      .join(" ");
      
    const delayClass = `delay-${(i % 10) + 1}`;
    
    const card = document.createElement("a");
    card.href = `topic.html?t=${topic.id}#${topic.id}`;
    card.className = `card ${delayClass}`;
    card.style.display = "block";
    card.innerHTML = `
      <div class="topic-title" style="color:${topic.color}">${topic.title}</div>
      <div style="margin-top:0.75rem">${levelBadges}</div>
      <div style="margin-top:1.25rem;">
        <div style="display:flex; justify-content:space-between; margin-bottom:0.4rem; font-size:0.85rem;" class="muted">
          <span>Mastery</span>
          <span>${pct}%</span>
        </div>
        <div class="progress-bar">
          <span style="width: ${pct}%"></span>
        </div>
      </div>`;
    grid.appendChild(card);
  });
}
init();
</script>
</body>
</html>
