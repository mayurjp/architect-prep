<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Architect Prep — Topic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="assets/js/theme.js"></script>
</head>
<body>
<div id="focus-modal">
  <button id="focus-close">Close</button>
  <div id="focus-content" class="focus-content"></div>
</div>
<header class="site">
  <div class="brand"><a href="index.html" style="color:inherit;text-decoration:none">Architect Prep</a></div>
  <nav>
    <a href="search.html">Search</a>
    <button id="theme-toggle" type="button" aria-label="Toggle theme"></button>
  </nav>
</header>
<main>
  <h1 id="topic-title">Topic</h1>
  <p id="topic-desc" class="muted"></p>
  <div id="level-tabs" class="tabs"></div>
  <div id="question-list"></div>
</main>
<script>
const LEVEL_ORDER = ["beginner", "intermediate", "advanced", "scenario"];

async function init() {
  const params = new URLSearchParams(location.search);
  const topicId = params.get("t") || location.hash.substring(1);
  const cb = Date.now();
  const [questions, topics] = await Promise.all([
    fetch(`data/questions.json?v=${cb}`).then((r) => r.json()),
    fetch(`data/topics.json?v=${cb}`).then((r) => r.json()),
  ]);

  const topic = topics.find((t) => t.id === topicId);
  if (!topic) {
    document.getElementById("topic-title").textContent = "Topic not found";
    return;
  }
  document.getElementById("topic-title").textContent = topic.title;
  document.getElementById("topic-title").style.color = topic.color;
  document.getElementById("topic-desc").textContent = topic.description;

  const byLevel = {};
  for (const q of questions.filter((q) => q.topic === topicId)) {
    (byLevel[q.level] = byLevel[q.level] || []).push(q);
  }
  for (const lvl of Object.keys(byLevel)) byLevel[lvl].sort((a, b) => a.seq - b.seq);

  const availableLevels = LEVEL_ORDER.filter((l) => byLevel[l] && byLevel[l].length);
  const tabsEl = document.getElementById("level-tabs");
  const listEl = document.getElementById("question-list");

  if (availableLevels.length === 0) {
    listEl.innerHTML = '<p class="empty-state">No content yet for this topic.</p>';
    return;
  }

  let activeLevel = availableLevels[0];

  window.toggleMastered = (id) => {
    const m = JSON.parse(localStorage.getItem("architect_mastered") || "[]");
    const idx = m.indexOf(id);
    if (idx > -1) m.splice(idx, 1);
    else m.push(id);
    localStorage.setItem("architect_mastered", JSON.stringify(m));
    render();
  };

  window.openFocus = (id) => {
    const q = questions.find(x => x.id === id);
    if(!q) return;
    const followUpsHtml = (q.followUps || []).map(f => `<div class="followup"><p class="question-text">${escapeHtml(f.question)}</p><div class="answer-body">${f.answerHtml}</div></div>`).join("");
    document.getElementById("focus-content").innerHTML = `
      <span class="badge ${q.level}">${q.level}</span>
      <p class="question-text">${escapeHtml(q.question)}</p>
      <div class="answer-body">${q.answerHtml}</div>
      ${followUpsHtml}
    `;
    document.getElementById("focus-modal").classList.add("active");
    document.body.style.overflow = "hidden";
    hljs.highlightAll();
  };

  document.getElementById("focus-close").onclick = () => {
    document.getElementById("focus-modal").classList.remove("active");
    document.body.style.overflow = "";
  };

  function render() {
    tabsEl.innerHTML = "";
    for (const lvl of availableLevels) {
      const btn = document.createElement("button");
      btn.textContent = `${lvl[0].toUpperCase()}${lvl.slice(1)} (${byLevel[lvl].length})`;
      btn.className = lvl === activeLevel ? "active" : "";
      btn.onclick = () => { activeLevel = lvl; render(); };
      tabsEl.appendChild(btn);
    }

    listEl.innerHTML = "";
    byLevel[activeLevel].forEach((q, i) => {
      const block = document.createElement("div");
      const delayClass = `delay-${(i % 10) + 1}`;
      const isMastered = JSON.parse(localStorage.getItem("architect_mastered") || "[]").includes(q.id);
      block.className = `card question-block ${isMastered ? "is-mastered" : ""} ${delayClass}`;
      const followUpsHtml = (q.followUps || [])
        .map(
          (f) => `<div class="followup">
            <p class="question-text">${escapeHtml(f.question)}</p>
            <div class="answer-body">${f.answerHtml}</div>
          </div>`
        )
        .join("");
      if (q.status === "planned") {
        block.innerHTML = `
          <span class="badge planned">Planned</span>
          <p class="question-text">${escapeHtml(q.question)}</p>
          <p class="muted">Coming soon.</p>`;
      } else {
        block.innerHTML = `
          <span class="badge ${q.level}">${q.level}</span>
          <button class="mastered-btn ${isMastered ? "is-mastered" : ""}" onclick="toggleMastered('${q.id}')">
            ${isMastered ? "Mastered ✓" : "Mark Mastered"}
          </button>
          <button class="focus-btn" onclick="openFocus('${q.id}')">Focus Mode ⛶</button>
          <p class="question-text">${escapeHtml(q.question)}</p>
          <div class="answer-body">${q.answerHtml}</div>
          ${followUpsHtml}`;
      }
      listEl.appendChild(block);
    });
    hljs.highlightAll();
  }

  render();
}

function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

init();
</script>
</body>
</html>
